name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: agent-core

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "agent-core/uv.lock"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Check formatting with Ruff
        run: uv run ruff format --check .

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Type check with mypy
        run: uv run mypy .

      - name: Run pytest with coverage
        run: |
          uv run pytest --cov=. --cov-report=term-missing --junitxml=pytest.xml | tee pytest-coverage.txt

      - name: Pytest coverage comment
        uses: MishaKav/pytest-coverage-comment@main
        if: ${{ github.event_name == 'pull_request' }}
        with:
          pytest-coverage-path: agent-core/pytest-coverage.txt
          junitxml-path: agent-core/pytest.xml

      - name: Add coverage to GitHub Job Summary
        run: |
          echo "### 📊 Test Coverage" >> $GITHUB_STEP_SUMMARY
          uv run coverage report -m --format=markdown >> $GITHUB_STEP_SUMMARY
